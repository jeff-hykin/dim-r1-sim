[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dim-r1-sim"
version = "0.1.0"
description = "A simulated Galaxea R1 Pro for dimOS: cmd_vel in; Mid-360 lidar, head cameras, odometry and tf out, standing in the dimOS office"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
authors = [{ name = "Jeff Hykin", email = "jeff.hykin@gmail.com" }]
dependencies = [
    "dimos>=0.0.14",
    "dim-go2-sim>=0.5.0",  # the Mid-360 pattern, the Embree raycaster, files.MeshFile and STL helpers
    "mujoco>=3.3.4",
    "numpy>=1.26",
    "scipy>=1.15",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/dim_r1_sim"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["dim_r1_sim"]
